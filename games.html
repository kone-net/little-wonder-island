<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>200关玩法安排 · 小小奇遇岛</title><link rel="stylesheet" href="assets/picnic.css"><style>main{max-width:1100px;padding:25px;margin:auto}h1{font-size:32px}p{line-height:1.9;margin:18px 0;color:#63775c}select{font:inherit;padding:10px 20px;border:1px solid #bdcbb0;border-radius:15px;background:#fffdf5;color:#31553f;margin-bottom:20px;min-height:44px}.games{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fffdf5;border:1px solid #d6dfca;border-radius:23px;padding:22px}.card h2{font-size:21px;line-height:1.6}.card small{color:#6b815d}.card p{font-size:14px}.modes{display:flex;flex-wrap:wrap;gap:7px}.modes span{background:#e9efdb;border-radius:12px;padding:6px 10px;font-size:12px}a.play{display:inline-block;margin-top:18px;color:#315f42;min-height:35px}@media(max-width:650px){.games{grid-template-columns:1fr}main{padding:20px 15px}h1{font-size:27px}}</style></head><body><header class="p-header"><a class="p-brand" href="index.html"><img src="assets/island.svg" alt="">小小奇遇岛</a><span class="p-edition">给陪伴的大人</span></header><main><h1>每一关，换一种发现方式。</h1><p id="summary"></p><p>基础规则允许复现以帮助迁移；每关采用不同材料、问题和学习目标，不把换颜色当作新玩法。开放创作与口述不自动判优劣，英语不按发音卡关。</p><label>查看年龄 <select id="age"><option value="">全部年龄</option></select></label><section class="games" id="games"></section></main><script src="assets/academy-data.js"></script><script src="assets/classroom-plan.js?v=experience-v1"></script><script src="assets/classroom-experience-data.js?v=experience-v1"></script><script src="assets/classroom-transfer-data.js?v=experience-v1"></script><script src="assets/classroom-experience-data.js?v=experience-v1"></script><script src="assets/classroom-transfer-data.js?v=experience-v1"></script><script src="assets/classroom-experience-data.js?v=experience-v1"></script><script src="assets/classroom-transfer-data.js?v=experience-v1"></script><script>const names={'listen-meaning':'听信息选意思','sentence-build':'听句搭建',cloze:'听音补位','listen-meaning':'听信息选意思','sentence-build':'听句搭建',cloze:'听音补位','listen-meaning':'听信息选意思','sentence-build':'听句搭建',cloze:'听音补位',hunt:'听音寻宝',memory:'翻牌记忆',delivery:'情境投递',pairs:'声音配对',bingo:'听力宾果',order:'句子与声音列车',route:'听指令送信',role:'角色表达','memory-story':'图片回忆 / 句子补位','story-cards':'故事图卡',comic:'四格表达','mind-map':'思维图','poster':'主题海报',collage:'拼贴创作',mirror:'对称绘画',illustrate:'诗文配画',evidence:'证据板',design:'设计与验收',timeline:'过程时间线',palette:'颜色工坊',stage:'角色展台','fraction-cover':'覆盖纸片看分数','scale-map':'方格房间设计','food-chain':'食物链连接',number:'数量与条件操作',sort:'归类投放',board:'棋形与规则挑战',sequence:'步骤重排',experiment:'条件对照实验',rhythm:'听拍节奏',circuit:'闭合电路',program:'重复指令',debug:'规则排错'};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));for(let i=3;i<=12;i++)document.getElementById('age').insertAdjacentHTML('beforeend',`<option>${i}</option>`);const ps=Object.values(CLASSROOM_PLAN);document.getElementById('summary').textContent='3—12岁，每龄20关。按实际目标配置动手工具，按语言需求配置英语；拓展图解采用另一情境，不重复当前游戏。';function render(){const age=document.getElementById('age').value;document.getElementById('games').innerHTML=ACADEMY.courses.filter(c=>!age||c.age===Number(age)).map(c=>{const p=CLASSROOM_PLAN[c.id];return `<article class="card"><small>${c.age} 岁 · 第 ${c.sequence} 关 · ${esc(c.subject)}</small><h2>${esc(c.title)}</h2><p>${esc(c.task)}</p><strong>${esc(p.experience.label)}</strong><div class="modes">${p.englishGames.map(x=>`<span>${names[x]}</span>`).join('')}</div><p>短片：${esc(CLASSROOM_TRANSFER_FILMS[c.id].frames[0])}</p><p>短片：${esc(CLASSROOM_TRANSFER_FILMS[c.id].frames[0])}</p><p>短片：${esc(CLASSROOM_TRANSFER_FILMS[c.id].frames[0])}</p><a class="play" href="classroom.html#${c.id}">进入这一关 →</a></article>`}).join('')}document.getElementById('age').onchange=render;render();</script></body></html>
