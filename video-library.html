<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>视频素材库 · 小小奇遇岛</title><link rel="icon" href="assets/island.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/app.css?v=20261024-library1"></head>
<body><header class="site-head"><a class="brand" href="index.html"><img src="assets/island.svg" alt=""><span class="brand-name">小小奇遇岛<small lang="en">Little Wonder Island</small></span></a><a class="btn small" href="index.html">回到课堂</a></header>
<main class="wrap"><section class="intro"><div class="eyebrow">家长与课程设计者 · 可复用素材</div><h1>找到下一次小奇遇。</h1><p id="catalogIntro"></p><p class="muted">已配课条目核对了官方频道、标题、时长与可得简介，尚未逐帧完整审看。其余仅为元数据候选，需逐片复核后配课。年龄是编辑建议；播放权限、广告和语速请由家长确认。</p>
<form id="videoFilters" class="video-filters" role="search"><label>搜索<input type="search" id="search" placeholder="大小、shadow、Bluey…"></label><label>年龄<select id="age"><option value="">全部年龄</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label><label>频道<select id="channel"><option value="">全部频道</option></select></label><label>主题<select id="topic"><option value="">全部主题</option></select></label><label>时长<select id="duration"><option value="">全部时长</option><option value="180">3 分钟以内</option><option value="300">5 分钟以内</option></select></label><label>状态<select id="review"><option value="已配课">已配课 · 40 集</option><option value="">全部短视频</option><option value="待逐片复核">待逐片复核</option></select></label></form>
<p id="resultCount" role="status" aria-live="polite"></p><div id="catalogResults" class="video-results"></div><div class="controls"><button class="btn small" id="more" type="button">再显示 30 条</button></div>
<details><summary>DG Slow English · 长片拓展备选</summary><p>A2 连续故事和长片不进入目前 3–6 岁默认课堂。此处单独记录，供已有基础的孩子由家长预看后选用。</p><div id="longVideos"></div></details><details><summary>本次嵌入受限 · 保留原片记录</summary><p>这些官方链接在本次测试中显示无法嵌入观看，已排除默认配课。可打开原片另行确认，不据此认定其全球下架。</p><div id="unavailableVideos"></div></details></section></main>
